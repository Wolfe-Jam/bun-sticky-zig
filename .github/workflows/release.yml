name: Release

on:
  push:
    tags:
      - 'v*'

# Run all JavaScript actions on Node 24. Node 20 is deprecated and becomes
# forced-default on 2026-06-16; this opts in early and covers actions that
# don't yet ship a Node 24 runtime (setup-zig, upload/download-artifact).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            artifact: faf-linux-x64
          # Pinned macos-15 (not macos-latest) — see ci.yml comment:
          # Xcode 26.4 on macos-latest breaks Zig 0.15.2's Darwin linker
          # (ziglang/zig#31658). macos-15's default Xcode (16.4) is unaffected.
          - os: macos-15
            target: x86_64-macos
            artifact: faf-macos-x64
          - os: macos-14
            target: aarch64-macos
            artifact: faf-macos-arm64

    steps:
      - uses: actions/checkout@v6

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build release
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Rename binary
        run: mv zig-out/bin/faf zig-out/bin/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: zig-out/bin/${{ matrix.artifact }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
