name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Run all JavaScript actions on Node 24 (Node 20 deprecated; forced 2026-06-16).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned macos-15 (not macos-latest): Xcode 26.4's default SDK on
        # macos-latest broke Zig 0.15.2's Darwin linker (arm64e-macos .tbd
        # entries — ziglang/zig#31658, fixed upstream in 0.16.0). macos-15's
        # default Xcode (16.4) predates the bug. Revisit when bumping to 0.16.
        os: [ubuntu-latest, macos-15]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Run tests
        run: zig build test

      - name: Build release
        run: zig build -Doptimize=ReleaseFast

      - name: Verify binary
        run: ./zig-out/bin/faf version
